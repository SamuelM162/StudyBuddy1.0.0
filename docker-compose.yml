services:
  studybuddy:
    container_name: studybuddy
    build: .
    ports:
      - "5001:5000"
    env_file:
      - .env
    volumes:
      - ./:/app
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      WATCHFILES_FORCE_POLLING: "true"
    command: flask --app run.py run --host=0.0.0.0 --port=5000 --reload
    restart: unless-stopped