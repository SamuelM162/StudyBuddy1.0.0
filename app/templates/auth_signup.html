{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="sb-card p-4 mt-4">
      <h3 class="mb-3">Create account</h3>
      <div class="mb-3">
        <label class="form-label">Display name</label>
        <input id="signup-name" type="text" class="form-control" placeholder="Your name (optional)">
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input id="signup-email" type="email" class="form-control" placeholder="you@example.com">
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input id="signup-password" type="password" class="form-control" placeholder="•••••••• (min 6 chars)">
      </div>

      <button id="signup-email-btn" class="btn sb-btn-primary w-100 mb-2">
        Create account
      </button>

      <button id="signup-google-btn" class="btn btn-outline-light w-100 mb-2">
        Sign up with Google
      </button>

      <p class="mt-3 small text-muted text-center">
        Already have an account?
        <a href="{{ url_for('auth.login') }}">Log in</a>
      </p>

      <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import {
          getAuth,
          createUserWithEmailAndPassword,
          updateProfile,
          GoogleAuthProvider,
          signInWithPopup
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Use global Firebase Web config injected by base.html
        const firebaseConfig = window.FIREBASE_CONFIG || {};
        if (!firebaseConfig.apiKey) {
          console.error("Missing Firebase config (apiKey). Check Flask Config.FIREBASE_CONFIG / env vars.", firebaseConfig);
          alert("Firebase configuration missing (apiKey). Please check server config.");
          throw new Error("Missing Firebase config (apiKey)");
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        async function sendTokenToBackend(user) {
          const idToken = await user.getIdToken();
          const res = await fetch("/auth/sessionLogin", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ idToken })
          });
          if (!res.ok) throw new Error("Session login failed");
          window.location.href = "/dashboard";
        }

        document.getElementById("signup-email-btn").onclick = async () => {
          const email = document.getElementById("signup-email").value;
          const password = document.getElementById("signup-password").value;
          const name = document.getElementById("signup-name").value;

          const cred = await createUserWithEmailAndPassword(auth, email, password);
          if (name) {
            await updateProfile(cred.user, { displayName: name });
          }
          await sendTokenToBackend(cred.user);
        };

        document.getElementById("signup-google-btn").onclick = async () => {
          const provider = new GoogleAuthProvider();
          const cred = await signInWithPopup(auth, provider);
          await sendTokenToBackend(cred.user);
        };
      </script>
    </div>
  </div>
</div>
{% endblock %}
