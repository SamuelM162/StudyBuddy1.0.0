{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="sb-card p-4 mt-4">
      <h3 class="mb-3">Create account</h3>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Display name</label>
          <input type="text" name="display_name" class="form-control" placeholder="Your name (optional)">
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" minlength="6" required>
        </div>
        <button type="submit" class="btn sb-btn-primary w-100">Sign up</button>
      </form>
      <p class="mt-3 small text-muted text-center">
        Already have an account?
        <a href="{{ url_for('auth.login') }}">Log in</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
