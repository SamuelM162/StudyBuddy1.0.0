{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="sb-card p-4 mt-4">
      <h3 class="mb-3">Log in</h3>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input id="login-email" type="email" class="form-control" placeholder="you@example.com" autocomplete="email">
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input id="login-password" type="password" class="form-control" placeholder="••••••••" autocomplete="current-password">
      </div>

      <button id="login-email-btn" class="btn sb-btn-primary w-100 mb-2" type="button">
        Log in with Email
      </button>

      <button id="login-google-btn" class="btn btn-outline-light w-100 mb-2" type="button">
        Continue with Google
      </button>

      <p class="mt-3 small text-muted text-center">
        Don't have an account yet?
        <a href="{{ url_for('auth.signup') }}">Sign up</a>
      </p>

      <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import {
          getAuth,
          signInWithEmailAndPassword,
          GoogleAuthProvider,
          signInWithPopup
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Use global Firebase Web config injected by base.html
        const firebaseConfig = window.FIREBASE_CONFIG || {};
        if (!firebaseConfig.apiKey) {
          console.error("Missing Firebase config (apiKey). Check Flask Config.FIREBASE_CONFIG / env vars.", firebaseConfig);
          alert("Firebase configuration missing (apiKey). Please check server config.");
          throw new Error("Missing Firebase config (apiKey)");
        }

        const fbApp = initializeApp(firebaseConfig);
        const auth = getAuth(fbApp);

        async function sendTokenToBackend(user) {
          const idToken = await user.getIdToken();
          const res = await fetch("/auth/sessionLogin", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ idToken })
          });
          if (!res.ok) {
            const txt = await res.text().catch(() => "");
            throw new Error("Session login failed: " + txt);
          }
          window.location.href = "/dashboard";
        }

        document.getElementById("login-email-btn").addEventListener("click", async () => {
          try {
            const email = document.getElementById("login-email").value.trim();
            const password = document.getElementById("login-password").value;
            const cred = await signInWithEmailAndPassword(auth, email, password);
            await sendTokenToBackend(cred.user);
          } catch (err) {
            console.error(err);
            alert(err?.message || "Login failed");
          }
        });

        document.getElementById("login-google-btn").addEventListener("click", async () => {
          try {
            const provider = new GoogleAuthProvider();
            const cred = await signInWithPopup(auth, provider);
            await sendTokenToBackend(cred.user);
          } catch (err) {
            console.error(err);
            alert(err?.message || "Google login failed");
          }
        });
      </script>
    </div>
  </div>
</div>
{% endblock %}
