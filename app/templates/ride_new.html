{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="sb-card p-4 mt-3">
      <h3 class="mb-3">New ride</h3>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">From</label>
          <input type="text" name="from_location" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">To</label>
          <input type="text" name="to_location" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Date & time</label>
          <input type="text" name="departure_time" class="form-control" placeholder="e.g. 2025-12-10 18:00" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Seats available</label>
          <input type="number" name="seats_total" class="form-control" min="1" value="1">
        </div>
        <div class="mb-3">
          <label class="form-label">Contribution (optional)</label>
          <input type="text" name="contribution" class="form-control" placeholder="e.g. ~5 EUR each">
        </div>
        <div class="mb-3">
          <label class="form-label">Notes (optional)</label>
          <textarea name="notes" rows="2" class="form-control"></textarea>
        </div>
        <button type="submit" class="btn sb-btn-primary">Create ride</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
