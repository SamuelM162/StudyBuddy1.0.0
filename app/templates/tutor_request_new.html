{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="sb-card p-4 mt-3">
      <h3 class="mb-3">New tutoring request</h3>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Subject / course</label>
          <input type="text" name="subject" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">What do you need help with?</label>
          <textarea name="description" rows="3" class="form-control" required></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Budget (optional)</label>
          <input type="text" name="budget" class="form-control" placeholder="e.g. 10 EUR / hour">
        </div>
        <button type="submit" class="btn sb-btn-primary">Publish request</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
