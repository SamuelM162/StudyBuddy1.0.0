{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="sb-card p-4 mt-3">
      <h3 class="mb-3">My profile</h3>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Display name</label>
          <input type="text" name="display_name" class="form-control"
                 value="{{ profile.display_name if profile else '' }}">
        </div>
        <div class="mb-3">
          <label class="form-label">Faculty / School</label>
          <input type="text" name="faculty" class="form-control"
                 value="{{ profile.faculty if profile else '' }}">
        </div>
        <div class="mb-3">
          <label class="form-label">Bio</label>
          <textarea name="bio" rows="3" class="form-control">{{ profile.bio if profile else '' }}</textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Subjects / interests</label>
          <input type="text" name="interests" class="form-control"
                 placeholder="e.g. Mathematics I, Programming 1, Economics"
                 value="{{ profile.interests | join(', ') if profile and profile.interests else '' }}">
          <div class="form-text">Comma-separated list. Used for study matches.</div>
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" name="is_tutor" id="is_tutor"
                 {% if profile.is_tutor %}checked{% endif %}>
          <label class="form-check-label" for="is_tutor">
            I am available as a tutor for at least one subject.
          </label>
        </div>
        <button type="submit" class="btn sb-btn-primary">Save profile</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
